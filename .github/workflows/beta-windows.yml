name: Windows beta package (untested)

on:
  push:
    branches: [codex/appearance-finishing, codex/beta3-save-feedback]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-beta-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Build portable x86-64 EXE; no runtime tests
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      RUSTUP_TOOLCHAIN: 1.99.0
      # Keep this portable EXE independent of the VC++ redistributable installer.
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: '-C target-feature=+crt-static'
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
      PYTHONUTF8: '1'
    steps:
      - name: Check out candidate source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        env:
          # Preserve Git blob bytes for cross-platform source-package review.
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          persist-credentials: false

      - name: Install pinned native MSVC compiler
        shell: pwsh
        run: |
          rustup toolchain install 1.99.0 --profile minimal --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustc --version --verbose
          cargo --version

      # package.py invokes cargo build --locked --release --target. It does not
      # run cargo test, examples, or the resulting application.
      - name: Build and package portable EXE with corresponding source and licenses
        shell: pwsh
        run: py -3 scripts/package.py --target x86_64-pc-windows-msvc

      - name: Inspect package bytes without launching Wireframe
        shell: pwsh
        run: py -3 scripts/verify_windows_beta.py --source-commit "${{ github.sha }}"

      - name: Retain candidate artifacts for review (no release publication)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Wireframe-windows-x86_64-beta-UNTESTED-${{ github.sha }}
          path: |
            dist/Wireframe-*-windows-x86_64.exe
            dist/Wireframe-*-windows-x86_64.exe.sha256
            dist/Wireframe-*-windows-x86_64.zip
            dist/Wireframe-*-windows-x86_64.zip.sha256
            dist/windows-beta-verification.json
            dist/WINDOWS-BETA-NOTES.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
