[package]
name = "wireframe"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A local desktop wireframing workspace"
license = "GPL-3.0-only"

[dependencies]
flate2 = "=1.1.10"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
eframe = { version = "0.36.2", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
base64 = "0.23.1"
skrifa = "0.44.0"
unicode-script = "=0.5.8"
unicode-segmentation = "1.13.3"
cosmic-text = "=0.19.0"
rfd = "0.17.2"
tempfile = "3"
directories = "6"
resvg = "0.48.1"
png = "0.18.1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif"] }
sha2 = "0.11.1"
krilla = { version = "=0.8.2", default-features = false, features = ["raster-images"] }

[profile.release]
lto = "thin"
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
core-text = "22.0.0"
core-foundation = "0.10.1"
core-graphics = "0.25.0"
