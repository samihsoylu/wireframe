[package]
name = "wireframe"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A local desktop wireframing workspace"
license = "GPL-3.0-only"

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.17.2"
tempfile = "3"
directories = "6"
resvg = "0.48.1"

[profile.release]
lto = "thin"
strip = true
