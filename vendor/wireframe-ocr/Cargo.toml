[package]
name = "wireframe-ocr"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-only"
description = "Offline screenshot text recognition for Wireframe"
build = "build.rs"

[dependencies]
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif"] }

[build-dependencies]
cmake = "=0.1.58"
flate2 = "=1.1.10"
sha2 = "=0.11.1"
tar = "=0.4.46"
